# Despliegue en Firebase App Hosting. Ver research.md, decisión 1b.
#
# Lo que hay que entender de este archivo es la línea que separa las dos mitades.
#
# Las variables con `availability: [BUILD, RUNTIME]` y valor literal son
# públicas: acaban dentro del paquete que se descarga el navegador. Ahí solo
# puede haber configuración del cliente de Firebase, que es pública por diseño
# porque lo que protege los datos son las reglas de seguridad y la sesión en el
# servidor, no el secreto de un identificador de proyecto.
#
# Las variables con `secret:` se resuelven contra Secret Manager y llevan
# `availability: [RUNTIME]` únicamente. Nunca BUILD: una variable disponible en
# la construcción puede quedar incrustada en el paquete del cliente si alguien
# la referencia desde código de cliente, y el token del proveedor autoriza a
# emitir comprobantes fiscales bajo el RUC de la empresa. Es exactamente la fuga
# que la decisión 1 de research.md existe para evitar.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # --- Configuración pública del cliente de Firebase ---------------------

  # Valores públicos del cliente web (proyecto blayblocklabs-antrax).
  # No son secretos: la protección real son las reglas de Firestore + Auth.
  # App Check queda fuera de alcance de esta entrega.
  - variable: VITE_FIREBASE_API_KEY
    value: AIzaSyAE70aXoC2NyIXBjn5EOV75-8WissmTvM0
    availability: [BUILD, RUNTIME]

  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: blayblocklabs-antrax.firebaseapp.com
    availability: [BUILD, RUNTIME]

  - variable: VITE_FIREBASE_PROJECT_ID
    value: blayblocklabs-antrax
    availability: [BUILD, RUNTIME]

  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: blayblocklabs-antrax.firebasestorage.app
    availability: [BUILD, RUNTIME]

  - variable: VITE_FIREBASE_APP_ID
    value: 1:930183430226:web:c0f4d1d9ac8f84a2651f8b
    availability: [BUILD, RUNTIME]

  # --- Configuración del servidor, no secreta ----------------------------

  # La ventana de anulación es "el mismo día", y ese día es el de Lima.
  # Calcularlo en UTC volvería inanulable una venta de las siete de la tarde a
  # los pocos minutos, así que la zona es configuración explícita y no una
  # suposición del entorno de ejecución.
  - variable: ZONA_HORARIA
    value: America/Lima
    availability: [RUNTIME]

  # Punto de entrada del proveedor de emisión. Se cambia a su entorno de
  # demostración para las pruebas de integración sin tocar código.
  - variable: PROVEEDOR_URL_BASE
    value: https://api.factpro.la
    availability: [RUNTIME]

  # --- Secretos -----------------------------------------------------------

  # Autoriza a emitir comprobantes bajo el RUC de la empresa. El secreto más
  # sensible del sistema.
  - variable: PROVEEDOR_TOKEN
    secret: suitpay-proveedor-token
    availability: [RUNTIME]

  # Dos credenciales del servicio de asistencia, no una: la segunda es la
  # contingencia ante error de cuota o límite de solicitudes, que es lógica de
  # servidor (contracts/functions.md, interpretarCaptura).
  - variable: ASISTENCIA_CLAVE_PRIMARIA
    secret: suitpay-asistencia-clave-primaria
    availability: [RUNTIME]

  - variable: ASISTENCIA_CLAVE_SECUNDARIA
    secret: suitpay-asistencia-clave-secundaria
    availability: [RUNTIME]
